[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fipd"
version = "0.2.0"
description = "A lightweight multimodal model for detecting fake investment promotions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "PyYAML>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
ocr   = ["paddleocr>=2.7.0", "paddlepaddle>=2.6.0", "easyocr>=1.7.0",
         "pytesseract>=0.3.10", "indic-transliteration>=2.3.0"]
model = ["torch>=2.1.0", "torchvision>=0.16.0", "transformers>=4.40.0",
         "sentencepiece>=0.1.99", "accelerate>=0.27.0", "scikit-learn>=1.3.0",
         "wandb>=0.16.0", "matplotlib>=3.7.0", "seaborn>=0.13.0"]
graph = ["torch-geometric>=2.5.0", "networkx>=3.2", "telethon>=1.34.0"]
serve = ["onnx>=1.15.0", "onnxruntime>=1.17.0", "fastapi>=0.110.0",
         "uvicorn>=0.27.0", "streamlit>=1.32.0"]
dev   = ["pytest>=8.0", "ruff>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
